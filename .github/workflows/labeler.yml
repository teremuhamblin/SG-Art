name: Labels automatiques des Pull Requests

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: Attribution des labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Application des labels
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
