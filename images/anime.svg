<svg width="200" height="200" viewBox="0 0 200 200"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4b483"/>
      <stop offset="100%" stop-color="#a67c52"/>
    </linearGradient>
  </defs>

  <g>
    <path d="M100 20 C40 60, 40 140, 100 180 C160 140, 160 60, 100 20 Z"
          fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 100 100" to="360 100 100"
                        dur="12s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="10;14;10"
               dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
